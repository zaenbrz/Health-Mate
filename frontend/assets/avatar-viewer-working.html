<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
    #canvas-container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Load Three.js from CDN (non-module version for better compatibility) -->
  <script src="https://unpkg.com/three@0.136.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.136.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/three@0.136.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // Immediate message on script start
    (function() {
      try {
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ 
            type: 'console', 
            level: 'log', 
            message: '🚀 Script execution started' 
          }));
        }
      } catch (e) {
        console.error('Failed to send initial message:', e);
      }
    })();

    let scene, camera, renderer, controls;
    let avatarModel = null;
    let mouthMesh = null;
    let jawBone = null;
    let morphIndex = null;
    let audioContext = null;
    let analyser = null;
    let audioSource = null;
    let mixer = null;
    let clock = new THREE.Clock();
    let currentAnimation = null;

    function sendMessage(data) {
      // For React Native WebView
      if (window.ReactNativeWebView) {
        try {
          window.ReactNativeWebView.postMessage(JSON.stringify(data));
        } catch (e) {
          console.error('Failed to send message:', e);
        }
      }
    }

    // Check if Three.js loaded (diagnostics only, don't init here)
    window.addEventListener('load', function() {
      sendMessage({ type: 'console', level: 'log', message: '📦 Window loaded. THREE available: ' + (typeof THREE !== 'undefined') });
      sendMessage({ type: 'console', level: 'log', message: '🎮 GLTFLoader available: ' + (typeof THREE !== 'undefined' && typeof THREE.GLTFLoader !== 'undefined') });
      sendMessage({ type: 'console', level: 'log', message: '🎮 OrbitControls (THREE.OrbitControls): ' + (typeof THREE !== 'undefined' && typeof THREE.OrbitControls !== 'undefined') });
      sendMessage({ type: 'console', level: 'log', message: '🎮 OrbitControls (global): ' + (typeof OrbitControls !== 'undefined') });
      
      if (typeof THREE === 'undefined') {
        sendMessage({ type: 'error', message: 'Three.js failed to load from CDN' });
      }
    });

    function init() {
      try {
        sendMessage({ type: 'console', level: 'log', message: '🔧 Starting init...' });
        
        // Scene
        scene = new THREE.Scene();
        scene.background = null; // transparent

        // Camera - positioned closer and higher to zoom in on avatar
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 2.3);

        // Renderer
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        sendMessage({ type: 'console', level: 'log', message: '✅ Renderer created' });

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
        directionalLight.position.set(2, 3, 2);
        scene.add(directionalLight);
        console.log('Lights added');

        // Controls - try multiple ways to access OrbitControls
        const ControlsCtor = (typeof THREE !== 'undefined' && THREE.OrbitControls) 
          ? THREE.OrbitControls 
          : (typeof OrbitControls !== 'undefined' ? OrbitControls : null);
        
        if (ControlsCtor) {
          controls = new ControlsCtor(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.target.set(0, 1.3, 0); // Target slightly higher to focus on upper body/head
          controls.update();
          console.log('Controls set up');
        } else {
          console.log('OrbitControls not available, continuing without controls');
        }

        // Handle window resize
        window.addEventListener('resize', onWindowResize);

        // Animation loop
        animate();
        console.log('Animation started');

        // Notify React Native that viewer is ready
        sendMessage({ type: 'ready' });
        console.log('Ready message sent');
      } catch (error) {
        console.error('Init error:', error);
        sendMessage({ type: 'error', message: 'Init failed: ' + error.message });
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta();
      
      // Update animation mixer
      if (mixer) {
        mixer.update(delta);
      }
      
      // Update mouth animation based on audio
      if (analyser && mouthMesh && morphIndex !== null) {
        const dataArray = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(dataArray);
        
        // Calculate RMS amplitude
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          const v = (dataArray[i] - 128) / 128;
          sum += v * v;
        }
        const rms = Math.sqrt(sum / dataArray.length);
        const value = Math.min(1, Math.max(0, (rms - 0.02) * 6));
        
        // Apply to morph target
        if (mouthMesh.morphTargetInfluences) {
          mouthMesh.morphTargetInfluences[morphIndex] = value;
        }
      } else if (analyser && jawBone) {
        // Fallback: animate jaw bone
        const dataArray = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(dataArray);
        
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          const v = (dataArray[i] - 128) / 128;
          sum += v * v;
        }
        const rms = Math.sqrt(sum / dataArray.length);
        const value = Math.min(1, Math.max(0, (rms - 0.02) * 6));
        
        jawBone.rotation.x = -value * 0.35;
      }

      if (controls) controls.update();
      renderer.render(scene, camera);
    }

    function loadAvatar(url) {
      console.log('Loading avatar from URL:', url);
      
      // Validate URL
      if (!url || typeof url !== 'string') {
        console.error('Invalid avatar URL:', url);
        sendMessage({ type: 'error', message: 'Invalid avatar URL' });
        return;
      }

      // Add morphTargets parameter for Ready Player Me to get visemes
      const corsUrl = url.includes('?') 
        ? `${url}&morphTargets=Oculus Visemes` 
        : `${url}?morphTargets=Oculus Visemes`;
      console.log('Loading with visemes URL:', corsUrl);

      const loader = new THREE.GLTFLoader();
      
      // Set crossOrigin for textures
      loader.setCrossOrigin('anonymous');
      
      loader.load(
        corsUrl,
        (gltf) => {
          console.log('✓ Avatar loaded successfully');
          
          // Remove old model if exists
          if (avatarModel) {
            scene.remove(avatarModel);
          }

          avatarModel = gltf.scene;
          scene.add(avatarModel);
          
          // Center and scale the avatar
          const box = new THREE.Box3().setFromObject(avatarModel);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          
          console.log('Avatar bounds:', { center, size });
          
          // Center the avatar
          avatarModel.position.sub(center);
          avatarModel.position.y += size.y / 2;
          
          console.log('✓ Avatar positioned and added to scene');

          // Find morph targets for lipsync
          let foundMorph = false;
          avatarModel.traverse((child) => {
            // Log all meshes for debugging
            if (child.isMesh) {
              console.log('Mesh found:', child.name, 'hasMorphs:', !!child.morphTargetInfluences, 'morphCount:', child.morphTargetInfluences?.length || 0);
              if (child.morphTargetDictionary) {
                console.log('  Morph targets:', Object.keys(child.morphTargetDictionary));
              }
            }

            if (!foundMorph && child.isMesh && child.morphTargetInfluences && child.morphTargetInfluences.length > 0) {
              mouthMesh = child;
              const dict = child.morphTargetDictionary || {};
              
              console.log('Selected morph mesh:', child.name, 'with targets:', Object.keys(dict));

              // Try to find a mouth-related morph (expanded list for RPM avatars)
              const mouthMorphs = [
                // Standard visemes
                'viseme_aa', 'viseme_AA', 'visemeAA',
                'viseme_O', 'viseme_o', 'visemeO', 
                'viseme_I', 'viseme_i', 'visemeI',
                'viseme_E', 'viseme_e', 'visemeE',
                'viseme_U', 'viseme_u', 'visemeU',
                // Fullbody specific
                'mouthOpen', 'jawOpen', 'mouthSmile',
                'mouthFunnel', 'mouthPucker', 'mouthRollLower', 'mouthRollUpper'
              ];
              
              for (const morphName of mouthMorphs) {
                if (dict[morphName] !== undefined) {
                  morphIndex = dict[morphName];
                  foundMorph = true;
                  console.log('✓ Using morph target:', morphName, 'at index', morphIndex);
                  break;
                }
              }

              // Fallback: use first non-silent morph
              if (morphIndex === null && Object.keys(dict).length > 0) {
                const keys = Object.keys(dict);
                const nonSilent = keys.find(k => !k.toLowerCase().includes('sil'));
                const firstMorph = nonSilent || keys[0];
                morphIndex = dict[firstMorph];
                console.log('✓ Using fallback morph:', firstMorph, 'at index', morphIndex);
              }

              sendMessage({ type: 'morphsFound', morphs: Object.keys(dict), selectedMorph: Object.keys(dict).find(k => dict[k] === morphIndex) });
            }

            // Find jaw bone as fallback
            if (!jawBone && child.isSkinnedMesh && child.skeleton) {
              for (const bone of child.skeleton.bones) {
                const name = bone.name.toLowerCase();
                if (name.includes('jaw') || name.includes('mandible')) {
                  jawBone = bone;
                  console.log('✓ Found jaw bone:', bone.name);
                  break;
                }
              }
            }
          });

          if (!foundMorph && !jawBone) {
            console.warn('⚠ No morph targets or jaw bone found in model!');
          }

          sendMessage({ type: 'loaded', success: true });
        },
        (progress) => {
          const percent = progress.total > 0 ? (progress.loaded / progress.total * 100).toFixed(2) : 0;
          console.log('Loading progress:', percent + '%', 'loaded:', progress.loaded, 'total:', progress.total);
        },
        (error) => {
          console.error('Error loading avatar:', error);
          console.error('Error details:', {
            message: error.message,
            stack: error.stack,
            url: url
          });
          sendMessage({ type: 'error', message: 'Load failed: ' + error.message });
        }
      );
    }

    function playAudio(audioUrl) {
      console.log('Playing audio:', audioUrl);

      // Create audio context if not exists
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      // Resume context if suspended
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }

      // Fetch and decode audio
      fetch(audioUrl)
        .then(response => response.arrayBuffer())
        .then(arrayBuffer => audioContext.decodeAudioData(arrayBuffer))
        .then(audioBuffer => {
          // Stop previous audio if playing
          if (audioSource) {
            try { audioSource.stop(); } catch (e) {}
          }

          // Create new source
          audioSource = audioContext.createBufferSource();
          audioSource.buffer = audioBuffer;

          // Create analyser
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;

          // Connect nodes
          audioSource.connect(analyser);
          analyser.connect(audioContext.destination);

          // Play
          audioSource.start();
          audioSource.onended = () => {
            sendMessage({ type: 'audioEnded' });
            analyser = null;
          };

          sendMessage({ type: 'audioPlaying' });
        })
        .catch(error => {
          console.error('Error playing audio:', error);
          sendMessage({ type: 'error', message: 'Failed to play audio: ' + error.message });
        });
    }

    function testMorph(strength = 1, duration = 800) {
      console.log('TEST MORPH called with strength:', strength, 'duration:', duration);
      
      if (mouthMesh && morphIndex !== null) {
        console.log('Applying morph to index:', morphIndex, 'on mesh:', mouthMesh.name);
        const clampedIndex = Math.min(mouthMesh.morphTargetInfluences.length - 1, Math.max(0, morphIndex));
        mouthMesh.morphTargetInfluences[clampedIndex] = strength;
        console.log('Morph applied. Current value:', mouthMesh.morphTargetInfluences[clampedIndex]);
        
        setTimeout(() => {
          if (mouthMesh && mouthMesh.morphTargetInfluences) {
            mouthMesh.morphTargetInfluences[clampedIndex] = 0;
            console.log('Morph reset to 0');
          }
        }, duration);
        sendMessage({ type: 'morphApplied', success: true, morphIndex: clampedIndex });
      } else if (jawBone) {
        console.log('Using jaw bone fallback:', jawBone.name);
        jawBone.rotation.x = -strength * 0.35;
        setTimeout(() => {
          if (jawBone) jawBone.rotation.x = 0;
        }, duration);
        sendMessage({ type: 'morphApplied', success: true, method: 'jawBone' });
      } else {
        console.warn('No morph target or jaw bone available!');
        console.warn('mouthMesh:', mouthMesh, 'morphIndex:', morphIndex, 'jawBone:', jawBone);
        sendMessage({ type: 'morphApplied', success: false, reason: 'No morph targets found' });
      }
    }

    // Listen for messages from React Native
    window.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        handleMessage(data);
      } catch (e) {
        console.error('Failed to parse message:', e);
      }
    });

    // For iOS
    document.addEventListener('message', (event) => {
      try {
        const data = JSON.parse(event.data);
        handleMessage(data);
      } catch (e) {
        console.error('Failed to parse message:', e);
      }
    });

    function handleMessage(data) {
      console.log('Received message:', data);

      switch (data.type) {
        case 'loadAvatar':
          loadAvatar(data.url);
          break;
        case 'playAudio':
          playAudio(data.url);
          break;
        case 'testMorph':
          testMorph(data.strength || 1, data.duration || 800);
          break;
        case 'stopAudio':
          if (audioSource) {
            try { audioSource.stop(); } catch (e) {}
            audioSource = null;
            analyser = null;
          }
          break;
        default:
          console.warn('Unknown message type:', data.type);
      }
    }

    // Initialize on load - SINGLE init call only
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM loaded, initializing viewer...');
      init();
      console.log('Viewer initialized');
    });
  </script>
</body>
</html>
